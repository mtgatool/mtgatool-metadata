name: "Auto-update sets from Arena data"

# The unattended release loop. Daily: adopt the newest client-uploaded
# GetFormats snapshot (see src/updateFormats.ts), diff Arena's card database
# against sets/, and when either leaves changes behind — new sets (every ~2
# months) or a changed formats table (bans, rotations) — test, bump the
# version, and push master plus a vN tag — which triggers the "Publish
# metadata to GitHub Releases" workflow exactly like a by-hand release.
#
# Two failure stances, both fine at this cadence:
# - updateSets exits non-zero (Scryfall doesn't know the set yet, or something
#   needs eyes): the run goes red, nothing is committed, tomorrow retries.
# - Tests fail after an update: red run, nothing pushed, a maintainer looks.
#
# Pushes prefer the GH_TOKEN PAT and fall back to the built-in GITHUB_TOKEN.
# The difference matters twice: tag pushes made with GITHUB_TOKEN do not
# trigger other workflows (so on the fallback the publish is started by an
# explicit workflow_dispatch instead, which GITHUB_TOKEN IS allowed to
# trigger), and master's branch-protection bypass belongs to accounts, so the
# fallback only works if the ruleset lets the github-actions app push.
# Keeping a live PAT in GH_TOKEN is the well-lit path.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # dispatch the publish workflow on the GITHUB_TOKEN fallback

concurrency:
  group: auto-update-sets
  cancel-in-progress: false

jobs:
  update:
    name: Discover and release new sets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Use node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Download Arena data
        run: |
          npx tsc
          node dist/setup.js

      # Adopt the newest client-uploaded GetFormats snapshot first: it is the
      # ground truth updateSets' mirror heuristic only approximates, and the
      # mirror skips codes a snapshot already brought in.
      - name: Sync formats.json from live snapshot
        run: node dist/updateFormats.js

      - name: Discover new sets
        run: node dist/updateSets.js

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- sets formats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Up to date; nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- sets formats.json
          fi

      # setup.js already downloaded Arena data, so run jest directly instead
      # of `npm test` (which would download it again). sets.test is the gate
      # that matters here: every Arena set code must now resolve to a set.
      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: npx jest src/

      - name: Commit, bump version and tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "mtgatool-bot"
          git config user.email "mtgatool@gmail.com"

          added=$(git diff --name-only -- sets | sed -E 's|sets/(.*)\.json|\1|' | tr '[:lower:]' '[:upper:]' | paste -sd, -)
          git add sets formats.json
          if [ -n "$added" ]; then
            git commit -m "Add new Arena sets: ${added}"
          else
            added="formats update"
            git commit -m "Sync formats.json from a live client snapshot"
          fi

          npm version major --no-git-tag-version
          major=$(node -p "require('./package.json').version.split('.')[0]")
          git add package.json package-lock.json
          git commit -m "Bump version to ${major}.0.0"
          git tag "v${major}"

          git push origin HEAD:master
          git push origin "v${major}"

          # A tag pushed with the built-in token starts nothing; dispatch the
          # publish ourselves in that case.
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            gh workflow run deploy.yml --ref "v${major}"
            echo "Dispatched the publish workflow for v${major} (GITHUB_TOKEN fallback)."
          fi
          echo "Released v${major} (${added})."
        env:
          GH_TOKEN: ${{ github.token }}
