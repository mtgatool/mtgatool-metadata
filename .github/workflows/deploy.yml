name: "Publish metadata to GitHub Releases"

# The old mtgatool.com FTP/API publishing route is being sunset. Metadata is now
# generated in CI and published as GitHub Release assets, served from the stable
# URL https://github.com/mtgatool/mtgatool-metadata/releases/latest/download/...
on:
  push:
    tags: "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    name: Generate + publish (${{ github.sha }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read database version
        id: v
        run: |
          echo "version=$(node -p "require('./package.json').version.split('.')[0]")" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: npm install --legacy-peer-deps

      # sets.test.ts asserts every set code in Arena's card database has a
      # SETS_DATA entry; cards.test.ts pins Arena's card schema. Both were wired
      # only to main.yml, which became workflow_dispatch-only during the move to
      # GitHub Releases, so nothing has run them since and 57 sets accumulated
      # unnoticed. Runs before generation on purpose: publishing metadata that
      # cannot name half its sets is worse than not publishing.
      - name: Test
        run: npm test

      - name: Generate metadata
        run: |
          npm run start
          npm run dist

      # getSetIcons only fetches icons for sets whose sets/<code>.json lacks
      # one, and writes what it fetches back into that file. Commit it back so
      # future builds reuse it and never re-ping Scryfall. Only meaningful on a
      # branch run (workflow_dispatch); tag pushes are detached and skip this.
      # Best-effort: master requires PRs, so the built-in GITHUB_TOKEN usually
      # can't push here. That's fine — icons are normally added by the update
      # workflow's commit. This step only opportunistically lands newly-fetched
      # icons and must never fail the publish.
      - name: Persist newly-fetched set icons
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git add sets 2>/dev/null || true
          if git diff --cached --quiet -- sets; then
            echo "No new set icons to cache."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: cache set icons for new sets [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" \
              || echo "Could not push cache (branch protection?) — commit sets/ manually."
          fi

      # Both formats ship. The JSON databases are the original published format
      # and stay exactly as they are — this repo's output is used outside
      # mtgatool-desktop, and dropping them would break anyone building on it.
      # SQLite is additive: same data, plus the per-card facts consumers would
      # otherwise re-derive, in a form that can be queried without holding the
      # whole thing in memory.
      - name: Stage release assets (stable, unversioned names)
        run: |
          mkdir -p release
          cp output/latest.json release/latest.json
          for f in output/${{ steps.v.outputs.version }}/v${{ steps.v.outputs.version }}-*-database.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            lang=$(echo "$base" | sed -E 's/^v[0-9]+-([a-z]+)-database\.json$/\1/')
            cp "$f" "release/${lang}-database.json"
          done
          for f in output/${{ steps.v.outputs.version }}/v${{ steps.v.outputs.version }}-*-database.sqlite; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            lang=$(echo "$base" | sed -E 's/^v[0-9]+-([a-z]+)-database\.sqlite$/\1/')
            cp "$f" "release/${lang}-database.sqlite"
          done
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Metadata v${{ steps.v.outputs.version }}
          files: release/*
          make_latest: true

      # Mirror the same files into a public Supabase Storage bucket so the WEB
      # app (app.mtgatool.com) can fetch them — GitHub release assets send no
      # CORS headers, so browsers can't. The per-language DBs (~25MB) are
      # uploaded GZIPPED (~6x smaller) to keep Storage egress down; the web
      # client inflates them (see database-wrapper.ts). latest.json stays raw.
      # No-op if the secret isn't configured, so it never blocks a release.
      - name: Mirror metadata to Supabase Storage (gzipped)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_SECRET_KEY not set; skipping Supabase mirror."
            exit 0
          fi
          base="https://decenyvqkbvydrrolwpk.supabase.co/storage/v1/object/metadata"
          upload() { # <file> <object-name> <content-type>
            # Send the key as BOTH apikey and Authorization: the Storage API
            # (Kong) expects `apikey`, and a secret key isn't a JWT, so passing
            # it only as Bearer makes storage-api's JWT decode fail with 400.
            code=$(curl -sS -o /tmp/sb_resp.txt -w "%{http_code}" -X POST "$base/$2" \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              -H "Content-Type: $3" \
              -H "x-upsert: true" \
              --data-binary "@$1")
            echo "  $2 -> HTTP $code"
            if [ "$code" -ge 300 ]; then
              echo "    response: $(cat /tmp/sb_resp.txt)"
              return 1
            fi
          }
          upload release/latest.json latest.json application/json
          for f in release/*-database.json release/*-database.sqlite; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            gzip -kf "$f"                       # -> $f.gz (keeps original)
            upload "$f.gz" "$name.gz" application/gzip
          done
